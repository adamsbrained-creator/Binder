# RUN THIS ONCE. Manual only: Actions > "Create signing key" > Run workflow.
#
# It makes your private signing key and a small text file with the 4 secret values the
# "Binder (signed)" workflow needs. The key is what lets every new APK install OVER the old
# one (no uninstalling, lists stay).
#
# After it finishes: open the run, download the artifact "signing-secrets" (it is a zip with one
# text file in it), follow the steps inside the file, then DELETE the artifact (Actions > the run >
# the artifact's bin icon). Keep the text file somewhere safe: if you lose the key you can never
# update the app again, only reinstall it.
name: Create signing key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  key:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make the key and the secrets file
        run: |
          set -euo pipefail
          mkdir -p out
          STORE_PW=$(openssl rand -hex 16)
          KEY_PW=$STORE_PW
          ALIAS=binder
          keytool -genkeypair -v \
            -keystore out/binder.jks -storetype PKCS12 \
            -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 36500 \
            -storepass "$STORE_PW" -keypass "$KEY_PW" \
            -dname "CN=Binder, O=Binder" > /dev/null
          # check it opens, without printing anything secret
          keytool -list -keystore out/binder.jks -storepass "$STORE_PW" -alias "$ALIAS" > /dev/null
          {
            echo "BINDER SIGNING KEY - keep this file private and safe"
            echo
            echo "Do this once:"
            echo "1. Open your repository on GitHub > Settings > Secrets and variables > Actions"
            echo "2. Press 'New repository secret' four times. Name = the word in capitals, Secret = the line under it."
            echo "   Copy each line exactly, with no spaces around it. The last one (KEYSTORE_BASE64) is one very long line, that is normal."
            echo "3. Then run the workflow 'Binder (signed)' and install that APK."
            echo "4. Delete the 'signing-secrets' artifact on the GitHub run page. Save this file somewhere safe."
            echo
            echo "KEYSTORE_PASSWORD"
            echo "$STORE_PW"
            echo
            echo "KEY_ALIAS"
            echo "$ALIAS"
            echo
            echo "KEY_PASSWORD"
            echo "$KEY_PW"
            echo
            echo "KEYSTORE_BASE64"
            base64 -w0 out/binder.jks
            echo
          } > out/signing-secrets.txt
          # no Windows line endings, so pasting into GitHub works
          sed -i 's/\r$//' out/signing-secrets.txt
          rm out/binder.jks
          echo "Done. Download the artifact 'signing-secrets' from this run's page."

      - uses: actions/upload-artifact@v4
        with:
          name: signing-secrets
          path: out/signing-secrets.txt
          retention-days: 1
          if-no-files-found: error
