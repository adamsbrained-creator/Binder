# Main build: runs on every push to main, or press "Run workflow" in the Actions tab.
# Result: Actions > the run > Artifacts > binder-debug-apk
name: Binder

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Optional: keep the SAME signing key on every build, so each new APK installs
      # over the old one and keeps your data. Without the secret it still builds fine.
      - name: Restore signing key (optional)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: binder-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
