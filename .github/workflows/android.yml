# Backup build, different setup: manual only ("Run workflow" in the Actions tab).
# Uses Zulu Java, installs the Android SDK explicitly, downloads Gradle itself and
# creates the Gradle wrapper, with no caching. Uploads error reports if it fails.
# Result: Actions > the run > Artifacts > binder-debug-apk-backup
name: Android (backup)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Install Gradle 8.9 and create the wrapper
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          /opt/gradle-8.9/bin/gradle wrapper --gradle-version 8.9 --no-daemon
          chmod +x gradlew

      - name: Restore signing key (optional)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3g"

      - uses: actions/upload-artifact@v4
        with:
          name: binder-debug-apk-backup
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload error reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports
            build/reports
          if-no-files-found: ignore
