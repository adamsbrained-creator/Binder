# Main build. Runs on every push to main/master, or press "Run workflow" in the Actions tab.
# Finds the Gradle project by itself, so it works whether the project is at the top of the
# repo or inside a "Binder" folder.
# Result: Actions > the run > Artifacts > binder-debug-apk
name: Binder

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Find the project
        run: |
          f=$(find . -maxdepth 3 -name 'settings.gradle*' -not -path './.git/*' | head -n1)
          if [ -z "$f" ]; then
            echo "::error::No settings.gradle.kts found. Files in the repo:"
            find . -maxdepth 3 -not -path './.git/*' | head -60
            exit 1
          fi
          echo "PROJ=$(dirname "$f")" >> "$GITHUB_ENV"
          echo "Project folder: $(dirname "$f")"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Optional: same signing key every build, so new APKs install over old ones.
      - name: Restore signing key (optional)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: binder-debug-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Unit tests run after the APK is saved, so a failing test never costs you the build.
      # If this step is red, open it to see which test failed.
      - name: Run unit tests
        working-directory: ${{ env.PROJ }}
        run: gradle testDebugUnitTest --stacktrace

      - name: Upload error reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: ${{ env.PROJ }}/app/build/reports
          if-no-files-found: ignore
